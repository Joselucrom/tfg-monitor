services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tfg_user
      POSTGRES_PASSWORD: tfg_pass
      POSTGRES_DB: tfg_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

volumes:
  postgres_data: